name: calorie_app
description: "Kayleo — a local-first calorie and macro tracking companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  speech_to_text: ^7.3.0
  share_plus: ^13.3.1
  intl: ^0.20.2
  camera: ^0.12.1
  http: ^1.2.0
  pytorch_lite: ^4.2.0
  mobile_scanner: ^7.4.2
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.1
  timezone: ^0.11.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  camera_platform_interface: ^2.12.0

dependency_overrides:
  pytorch_lite:
    path: packages/pytorch_lite

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/food_edge_detector_500.pt
    - assets/metadata/labels.json
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
