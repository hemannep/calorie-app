<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kayleo — snap, speak or type your meal. A local-first nutrition companion with photo, text, and voice meal logging.">
  <meta name="theme-color" content="#163E2D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kayleo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Kayleo: AI Calorie Tracker</title>
  <style>
    html, body { margin: 0; padding: 0; background: #F7F5ED; height: 100%; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #163E2D; font-family: system-ui, sans-serif; background: #F7F5ED; z-index: 2; }
    #loading img { width: 64px; height: 64px; margin-bottom: 18px; }
    #loading strong { font-size: 46px; letter-spacing: -2px; }
    #loading p { color: #b5c7b8; font-size: 14px; margin: 14px 0 32px; }
    .loader { width: 22px; height: 22px; border: 2px solid #55745e; border-top-color: #B8E36B; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .loader { animation: none; } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-label="Kayleo is loading">
    <strong>kayleo<span style="color:#B8E36B">.</span></strong>
  </div>
  <script>window.addEventListener('flutter-first-frame', function () { document.getElementById('loading')?.remove(); });</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
